# Coque Android — téléphone et tablette.
#
# Ce projet ne contient presque pas de code : tout vit dans
# ../bibliotheque/fer_shared. Il porte la configuration Android (permissions,
# version minimale du SDK) et branche l'implémentation des notifications locales.
#
# Deux points d'entrée dans lib/ : main.dart (téléphone et tablette) et
# main_montre.dart (Wear OS). Il n'y a plus de projet séparé pour la montre.
name: fer_android
description: Forbach en Rose — application du coureur (Android).
publish_to: none

# ⚠️ CE NUMÉRO EST ENVOYÉ AU SERVEUR dans X-App-Version, et c'est lui que
# compare `app_version_minimale` (Réglages → API). Le relever ici puis publier
# est ce qui permet de mettre une version défectueuse hors service partout.
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Le cœur : API, modèles, écrans, suivi de course.
  fer_shared:
    path: ../bibliotheque/fer_shared

  # Rappel avant la course et réception des push. Paquet à part du cœur : celui-ci
  # doit rester compilable sans les greffons de notification, que la montre
  # n'utilise pas.
  fer_rappels:
    path: ../bibliotheque/fer_rappels

  # Écran rond, mode ambiant, forme de l'appareil — pour le point d'entrée
  # `lib/main_montre.dart`. Sans lui, l'interface est rognée aux quatre coins
  # sur les montres rondes, c'est-à-dire la plupart.
  wear_plus: ^1.1.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
