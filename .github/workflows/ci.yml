# Vérification automatique à chaque envoi sur GitHub.
#
# Pourquoi : il n'y a pas de PHP sur le poste de développement. Une erreur de
# syntaxe partait donc telle quelle sur le serveur — « PHP Parse error … in
# src/partials/navbar-admin.php on line 569 », et toute l'administration
# tombait. Ce contrôle lance le banc docs/test-integrite.php (php -l sur tout
# le site + contrôles de cohérence, sans base de données) sur plusieurs
# versions de PHP, avant que le code n'atteigne un serveur.
#
# docs/audit-bdd.php n'est PAS lancé ici : il lui faut un MySQL jetable.

name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
  workflow_dispatch:
  # Rejoué par deploy.yml avant tout envoi en production.
  workflow_call:

jobs:
  integrite:
    name: Intégrité (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      # Historique complet : le banc compare certains fichiers à des commits
      # anciens (gel de login.php, d'api/v1.php…).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Banc d'intégrité
        run: php docs/test-integrite.php

  # Failles connues des bibliothèques de vendor/ (base GitHub Advisory).
  # ⚠️ NON BLOQUANT, et c'est voulu : une faille découverte dans une
  # dépendance ne doit pas empêcher de déployer un correctif urgent. Le job
  # apparaît en rouge dans l'onglet Actions — c'est le signal de mettre
  # vendor/ à jour.
  dependances:
    name: Failles des dépendances
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - name: composer audit
        run: composer audit --locked --abandoned=report --no-interaction
